<text x="70" y="68" font-family="Arial" font-size="14" letter-spacing="3" fill="#a95b38">BETA DAY SHOP · LOCAL PORTFOLIO</text>
<text x="70" y="117" font-family="Arial" font-size="36" font-weight="700">One storefront. Five business services.</text>
<text x="70" y="151" class="sub">Explicit gateway routing · JWT + resource ownership · simulated payments and refunds</text>
